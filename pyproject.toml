[project]
name = "cso-ie-mcp"
version = "0.1.0"
description = "Simple MCP server for data.cso.ie"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
]

[project.scripts]
cso-ie-mcp = "cso_ie_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cso_ie_mcp"]
